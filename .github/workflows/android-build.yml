name: Devil Enhancer Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx cap add android

      - run: |
          python3 - <<'PY'
          p="android/app/build.gradle"
          s=open(p).read()
          s=s.replace("minSdkVersion = 23", "minSdkVersion = 24")
          s=s.replace("minSdkVersion 23", "minSdkVersion 24")
          open(p,"w").write(s)
          PY

      - run: |
          python3 - <<'PY'
          p="android/app/build.gradle"
          s=open(p).read()
          if "dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7" not in s:
              s=s.replace(
                  "dependencies {",
                  'dependencies {\n    implementation "dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7"',
                  1
              )
          open(p,"w").write(s)
          PY
            - name: Create EnhancerPlugin
      - run: |
          mkdir -p android/app/src/main/java/com/devil/enhancer

          cat > android/app/src/main/java/com/devil/enhancer/EnhancerPlugin.java <<'JAVA'
          package com.devil.enhancer;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;

          import androidx.activity.result.ActivityResult;

          import com.arthenica.ffmpegkit.FFmpegKit;
          import com.arthenica.ffmpegkit.ReturnCode;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import android.util.Base64;

          import java.io.File;
          import java.io.FileOutputStream;

          @CapacitorPlugin(name = "Enhancer")
          public class EnhancerPlugin extends Plugin {

              @PluginMethod
              public void pickVideo(PluginCall call) {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("video/*");

                  startActivityForResult(call, intent, "videoPicked");
              }

              @ActivityCallback
              private void videoPicked(PluginCall call, ActivityResult result) {
                  if (result.getResultCode() != android.app.Activity.RESULT_OK ||
                      result.getData() == null) {
                      call.reject("Video selection cancelled");
                      return;
                  }

                  Uri uri = result.getData().getData();

                  if (uri == null) {
                      call.reject("Video URI is empty");
                      return;
                  }

                  JSObjectData(call, uri.toString());
              }

              private void JSObjectData(PluginCall call, String uri) {
                  com.getcapacitor.JSObject ret =
                      new com.getcapacitor.JSObject();

                  ret.put("uri", uri);

                  call.resolve(ret);
              }

              @PluginMethod
              public void enhanceVideo(PluginCall call) {

                  String data = call.getString("data");
                  String fileName = call.getString("fileName", "video.mp4");
                  String mode = call.getString("mode", "4K");

                  if (data == null || data.isEmpty()) {
                      call.reject("Video data is missing");
                      return;
                  }

                  try {

                      Context context = getContext();

                      File workDir = context.getCacheDir();

                      File inputFile =
                          new File(workDir, "enhancer_input.mp4");

                      File outputFile =
                          new File(
                              context.getExternalFilesDir(null),
                              "Enhanced_" + System.currentTimeMillis() + ".mp4"
                          );

                      byte[] videoBytes =
                          Base64.decode(data, Base64.DEFAULT);

                      FileOutputStream fos =
                          new FileOutputStream(inputFile);

                      fos.write(videoBytes);
                      fos.flush();
                      fos.close();

                      String size;

                      if ("8K".equalsIgnoreCase(mode)) {
                          size = "7680:4320";
                      } else {
                          size = "3840:2160";
                      }

                      String input =
                          inputFile.getAbsolutePath();

                      String output =
                          outputFile.getAbsolutePath();

                      String command =
                          "-y " +
                          "-i \"" + input + "\" " +
                          "-vf \"scale=" + size +
                          ":force_original_aspect_ratio=decrease," +
                          "pad=" + size +
                          ":(ow-iw)/2:(oh-ih)/2\" " +
                          "-c:v mpeg4 " +
                          "-q:v 2 " +
                          "-c:a aac " +
                          "-b:a 192k " +
                          "\"" + output + "\"";

                      FFmpegKit.executeAsync(
                          command,
                          session -> {

                              if (ReturnCode.isSuccess(
                                      session.getReturnCode())) {

                                  com.getcapacitor.JSObject result =
                                      new com.getcapacitor.JSObject();

                                  result.put(
                                      "uri",
                                      outputFile.getAbsolutePath()
                                  );

                                  result.put(
                                      "mode",
                                      mode
                                  );

                                  result.put(
                                      "fileName",
                                      fileName
                                  );

                                  call.resolve(result);

                              } else {

                                  call.reject(
                                      "FFmpeg processing failed. Code: " +
                                      session.getReturnCode()
                                  );
                              }

                              if (inputFile.exists()) {
                                  inputFile.delete();
                              }
                          });

                  } catch (Exception e) {

                      call.reject(
                          "Enhancement error: " +
                          e.getMessage()
                      );
                  }
              }
          }
          JAVA 
      - name: Patch MainActivity
        shell: bash
        run: |
          python3 - <<'PY'
          p="android/app/src/main/java/com/devil/enhancer/MainActivity.java"
          s=open(p).read()

          if "import com.devil.enhancer.EnhancerPlugin;" not in s:
              s=s.replace(
                  "package com.devil.enhancer;",
                  "package com.devil.enhancer;\n\nimport com.devil.enhancer.EnhancerPlugin;"
              )

          if "registerPlugin(EnhancerPlugin.class);" not in s:
              s=s.replace(
                  "super.onCreate(savedInstanceState);",
                  "super.onCreate(savedInstanceState);\n        registerPlugin(EnhancerPlugin.class);"
              )

          open(p, "w").write(s)
          PY

      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Set minSdkVersion to 24
        run: |
          python3 - <<'PY'
          p="android/variables.gradle"
          s=open(p).read()
          s=s.replace("minSdkVersion = 23", "minSdkVersion = 24")
          open(p, "w").write(s)
          PY

      - run: chmod +x android/gradlew

      - run: cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: devil-enhancer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
