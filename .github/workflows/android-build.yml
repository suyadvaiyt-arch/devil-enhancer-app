name: Devil Enhancer Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx cap add android

      - run: |
          python3 - <<'PY'
          p="android/app/build.gradle"
          s=open(p).read()
          s=s.replace("minSdkVersion = 23", "minSdkVersion = 24")
          s=s.replace("minSdkVersion 23", "minSdkVersion 24")
          open(p,"w").write(s)
          PY

      - run: |
          python3 - <<'PY'
          p="android/app/build.gradle"
          s=open(p).read()
          if "dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7" not in s:
              s=s.replace(
                  "dependencies {",
                  'dependencies {\n    implementation "dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7"',
                  1
              )
          open(p,"w").write(s)
          PY
      - run: |
         mkdir -p android/app/src/main/java/com/devil/enhancer
         cat > android/app/src/main/java/com/devil/enhancer/EnhancerPlugin.java <<'JAVA'
         package com.devil.enhancer;

         import android.content.Intent;
         import android.net.Uri;

         import com.getcapacitor.ActivityResult;
         import com.getcapacitor.Plugin;
         import com.getcapacitor.PluginCall;
         import com.getcapacitor.PluginMethod;
         import com.getcapacitor.annotation.ActivityCallback;
         import com.getcapacitor.annotation.CapacitorPlugin;

         @CapacitorPlugin(name = "Enhancer")
         public class EnhancerPlugin extends Plugin {

         @PluginMethod
         public void pickVideo(PluginCall call) {
            Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
            intent.addCategory(Intent.CATEGORY_OPENABLE);
            intent.setType("video/*");
            startActivityForResult(call, intent, "videoPicked");
         }

         @ActivityCallback
         private void videoPicked(PluginCall call, ActivityResult result) {
            if (result.getResultCode() != android.app.Activity.RESULT_OK) {
                call.reject("Video selection cancelled");
                return;
            }

            Intent data = result.getData();
            if (data == null || data.getData() == null) {
                call.reject("No video selected");
                return;
            }

            Uri uri = data.getData();

            call.resolve(
                new com.getcapacitor.JSObject().put("uri", uri.toString())
            );
         }
         }
      - name: Patch MainActivity
        shell: bash
        run: |
          python3 - <<'PY'
          p="android/app/src/main/java/com/devil/enhancer/MainActivity.java"
          s=open(p).read()

          if "import com.devil.enhancer.EnhancerPlugin;" not in s:
              s=s.replace(
                  "package com.devil.enhancer;",
                  "package com.devil.enhancer;\n\nimport com.devil.enhancer.EnhancerPlugin;"
              )

          if "registerPlugin(EnhancerPlugin.class);" not in s:
              s=s.replace(
                  "super.onCreate(savedInstanceState);",
                  "super.onCreate(savedInstanceState);\n        registerPlugin(EnhancerPlugin.class);"
              )

          open(p, "w").write(s)
          PY

      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - run: chmod +x android/gradlew

      - run: cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: devil-enhancer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
