name: Devil Enhancer Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # 3. Install npm packages
      - name: Install dependencies
        run: |
          npm install


      # 4. Install Capacitor Android
      - name: Install Capacitor Android
        run: |
          CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          npm install @capacitor/android@$CAP_VERSION


      # 5. Create Android project
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap copy android


      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # 7. Set minimum Android SDK
      - name: Set Android minSdk
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")

          if p.exists():
              text = p.read_text()

              if "minSdkVersion =" in text:
                  text = re.sub(
                      r"minSdkVersion\s*=\s*\d+",
                      "minSdkVersion = 24",
                      text
                  )
              else:
                  text = text.replace(
                      "ext {",
                      "ext {\n    minSdkVersion = 24",
                      1
                  )

              p.write_text(text)

          print("Android minSdk set to 24")
          PY


      # 8. Add FFmpegKit
      - name: Add FFmpegKit dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          dependency = (
              "implementation "
              "'dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.7'"
          )

          if dependency not in text:
              marker = "dependencies {"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n    " + dependency,
                      1
                  )
              else:
                  text += (
                      "\n\ndependencies {\n"
                      "    " + dependency + "\n"
                      "}\n"
                  )

          p.write_text(text)

          print("FFmpegKit dependency added")
          PY


      # 9. Create EnhancerPlugin
      - name: Create EnhancerPlugin
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/devil/enhancer

          cat > android/app/src/main/java/com/devil/enhancer/EnhancerPlugin.java <<'JAVA'
          package com.devil.enhancer;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;

          import androidx.activity.result.ActivityResult;

          import com.arthenica.ffmpegkit.FFmpegKit;
          import com.arthenica.ffmpegkit.ReturnCode;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;

          @CapacitorPlugin(name = "Enhancer")
          public class EnhancerPlugin extends Plugin {

              @PluginMethod
              public void pickVideo(PluginCall call) {

                  Intent intent = new Intent(
                          Intent.ACTION_OPEN_DOCUMENT
                  );

                  intent.addCategory(
                          Intent.CATEGORY_OPENABLE
                  );

                  intent.setType("video/*");

                  startActivityForResult(
                          call,
                          intent,
                          "videoPicked"
                  );
              }


              @ActivityCallback
              private void videoPicked(
                      PluginCall call,
                      ActivityResult result
              ) {

                  if (
                          result.getResultCode() != Activity.RESULT_OK ||
                          result.getData() == null ||
                          result.getData().getData() == null
                  ) {
                      call.reject(
                              "Video selection cancelled"
                      );
                      return;
                  }

                  Uri uri =
                          result.getData().getData();

                  JSObject response =
                          new JSObject();

                  response.put(
                          "uri",
                          uri.toString()
                  );

                  call.resolve(response);
              }


              @PluginMethod
              public void enhanceVideo(
                      PluginCall call
              ) {

                  String data =
                          call.getString("data");

                  String mode =
                          call.getString("mode");

                  String fpsString =
                          call.getString("fps");

                  if (
                          data == null ||
                          data.isEmpty()
                  ) {
                      call.reject(
                              "Video URI missing"
                      );
                      return;
                  }

                  if (
                          mode == null ||
                          mode.isEmpty()
                  ) {
                      mode = "4K";
                  }

                  int targetFps = 60;

                  try {
                      if (
                              fpsString != null &&
                              !fpsString.isEmpty()
                      ) {
                          targetFps =
                                  Integer.parseInt(
                                          fpsString
                                  );
                      }
                  } catch (Exception ignored) {
                      targetFps = 60;
                  }

                  if (
                          targetFps != 60 &&
                          targetFps != 120 &&
                          targetFps != 240
                  ) {
                      targetFps = 60;
                  }

                  final String finalMode = mode;
                  final int finalFps = targetFps;

                  try {

                      Uri inputUri =
                              Uri.parse(data);

                      /*
                       * Copy Android content:// URI
                       * into temporary local file.
                       */
                      File inputFile =
                              new File(
                                      getContext()
                                              .getCacheDir(),
                                      "devil_input_" +
                                      System.currentTimeMillis() +
                                      ".mp4"
                              );

                      copyUriToFile(
                              inputUri,
                              inputFile
                      );


                      /*
                       * Output directory
                       */
                      File outputDirectory =
                              getContext()
                                      .getExternalFilesDir(
                                              android.os.Environment
                                                      .DIRECTORY_MOVIES
                                      );

                      if (
                              outputDirectory == null
                      ) {
                          outputDirectory =
                                  new File(
                                          getContext()
                                                  .getFilesDir(),
                                          "movies"
                                  );
                      }

                      if (
                              !outputDirectory.exists()
                      ) {
                          outputDirectory.mkdirs();
                      }


                      File outputFile =
                              new File(
                                      outputDirectory,
                                      "DevilEnhancer_" +
                                      System.currentTimeMillis() +
                                      ".mp4"
                              );


                      /*
                       * Resolution
                       */
                      String resolution =
                              "3840:2160";

                      if (
                              "8K".equalsIgnoreCase(
                                      finalMode
                              )
                      ) {
                          resolution =
                                  "7680:4320";
                      }


                      /*
                       * Video processing filter
                       */
                      String videoFilter =
                              "scale=" +
                              resolution +
                              ":force_original_aspect_ratio=decrease," +
                              "pad=" +
                              resolution +
                              ":(ow-iw)/2:(oh-ih)/2," +
                              "fps=" +
                              finalFps;


                      /*
                       * FFmpeg command
                       */
                      String command =
                              "-y " +
                              "-i " +
                              quote(
                                      inputFile
                                              .getAbsolutePath()
                              ) +
                              " " +
                              "-vf " +
                              quote(videoFilter) +
                              " " +
                              "-c:v libx264 " +
                              "-preset veryfast " +
                              "-crf 20 " +
                              "-pix_fmt yuv420p " +
                              "-c:a aac " +
                              "-b:a 192k " +
                              "-movflags +faststart " +
                              quote(
                                      outputFile
                                              .getAbsolutePath()
                              );


                      /*
                       * Run FFmpeg
                       */
                      FFmpegKit.executeAsync(
                              command,
                              session -> {

                                  if (
                                          ReturnCode.isSuccess(
                                                  session
                                                          .getReturnCode()
                                          )
                                  ) {

                                      JSObject response =
                                              new JSObject();

                                      response.put(
                                              "uri",
                                              outputFile
                                                      .getAbsolutePath()
                                      );

                                      response.put(
                                              "fileName",
                                              outputFile.getName()
                                      );

                                      response.put(
                                              "mode",
                                              finalMode
                                      );

                                      response.put(
                                              "fps",
                                              finalFps
                                      );

                                      call.resolve(
                                              response
                                      );

                                  } else {

                                      String error =
                                              session
                                                      .getFailStackTrace();

                                      if (
                                              error == null ||
                                              error.isEmpty()
                                      ) {
                                          error =
                                                  "FFmpeg processing failed. " +
                                                  "Return code: " +
                                                  session
                                                          .getReturnCode();
                                      }

                                      call.reject(
                                              error
                                      );
                                  }


                                  /*
                                   * Delete temporary file
                                   */
                                  if (
                                          inputFile.exists()
                                  ) {
                                      inputFile.delete();
                                  }
                              }
                      );

                  } catch (Exception e) {

                      call.reject(
                              "Enhancement error: " +
                              String.valueOf(
                                      e.getMessage()
                              )
                      );
                  }
              }


              /*
               * Copy Android content URI
               * to local temporary file.
               */
              private void copyUriToFile(
                      Uri uri,
                      File destination
              ) throws Exception {

                  InputStream input =
                          getContext()
                                  .getContentResolver()
                                  .openInputStream(uri);

                  if (input == null) {
                      throw new Exception(
                              "Cannot open selected video"
                      );
                  }

                  FileOutputStream output =
                          new FileOutputStream(
                                  destination
                          );

                  byte[] buffer =
                          new byte[1024 * 1024];

                  int length;

                  while (
                          (length =
                                  input.read(buffer)) != -1
                  ) {
                      output.write(
                              buffer,
                              0,
                              length
                      );
                  }

                  output.flush();
                  output.close();
                  input.close();
              }


              /*
               * Safely quote FFmpeg paths.
               */
              private String quote(
                      String value
              ) {

                  return "\"" +
                          value.replace(
                                  "\"",
                                  "\\\""
                          ) +
                          "\"";
              }
          }
          JAVA


      # 10. Create MainActivity
      - name: Create MainActivity
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/devil/enhancer

          cat > android/app/src/main/java/com/devil/enhancer/MainActivity.java <<'JAVA'
          package com.devil.enhancer;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity
                  extends BridgeActivity {

              @Override
              public void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(
                          savedInstanceState
                  );

                  registerPlugin(
                          EnhancerPlugin.class
                  );
              }
          }
          JAVA


      # 11. Sync Capacitor
      - name: Sync Capacitor
        run: |
          npx cap sync android


      # 12. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle


      # 13. Make Gradle executable
      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew


      # 14. Build APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug


      # 15. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: devil-enhancer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
