name: Devil Enhancer Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install npm packages
      - name: Install dependencies
        run: npm install

      # 4. Create Android project
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap copy android

      # 5. Set minimum Android SDK to 24
      - name: Set Android minSdk
        run: |
          python3 -c "from pathlib import Path; import re; p=Path('android/variables.gradle'); s=p.read_text(); s=re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', s); p.write_text(s)"

      # 6. Add FFmpegKit
      - name: Add FFmpegKit dependency
        run: |
          python3 -c "from pathlib import Path; p=Path('android/app/build.gradle'); s=p.read_text(); dep='implementation \"dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7\"'; s=s.replace('dependencies {', 'dependencies {\n    '+dep, 1) if dep not in s else s; p.write_text(s)"

      # 7. Create EnhancerPlugin
      - name: Create EnhancerPlugin
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/devil/enhancer

          cat > android/app/src/main/java/com/devil/enhancer/EnhancerPlugin.java <<'JAVA'
          package com.devil.enhancer;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Environment;

          import androidx.activity.result.ActivityResult;

          import com.arthenica.ffmpegkit.FFmpegKit;
          import com.arthenica.ffmpegkit.ReturnCode;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.io.FileOutputStream;

          @CapacitorPlugin(name = "Enhancer")
          public class EnhancerPlugin extends Plugin {

          @PluginMethod
          public void pickVideo(PluginCall call) {
          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
          intent.addCategory(Intent.CATEGORY_OPENABLE);
          intent.setType("video/*");

          startActivityForResult(call, intent, "videoPicked");
          }

          @ActivityCallback
          private void videoPicked(PluginCall call, ActivityResult result) {
          if (result.getResultCode() != Activity.RESULT_OK
                || result.getData() == null
                || result.getData().getData() == null) {
            call.reject("Video selection cancelled");
            return;
          }

          Uri uri = result.getData().getData();
 
          JSObject response = new JSObject();
          response.put("uri", uri.toString());

          call.resolve(response);
          }

          @PluginMethod
          public void enhanceVideo(PluginCall call) {

          String data = call.getString("data");
          String mode = call.getString("mode");
          String fpsValue = call.getString("fps");

          if (mode == null || mode.isEmpty()) {
            mode = "4K";
          }

          if (fpsValue == null || fpsValue.isEmpty()) {
            fpsValue = "30";
          }

          if (data == null || data.isEmpty()) {
            call.reject("Video data missing");
            return;
          }

          final String targetMode = mode;

          int parsedFps = 30;

          try {
            parsedFps = Integer.parseInt(fpsValue);
          } catch (Exception ignored) {
            parsedFps = 30;
          }

          if (parsedFps != 120 && parsedFps != 240) {
            parsedFps = 30;
           }

          final int targetFps = parsedFps;

          try {

            int commaIndex = data.indexOf(',');

            if (commaIndex >= 0) {
                data = data.substring(commaIndex + 1);
            }

            byte[] videoBytes = android.util.Base64.decode(
                    data,
                    android.util.Base64.DEFAULT
            );

            File inputFile = new File(
                    getContext().getCacheDir(),
                    "enhance_input_" + System.currentTimeMillis() + ".mp4"
            );

            FileOutputStream outputStream =
                    new FileOutputStream(inputFile);

            outputStream.write(videoBytes);
            outputStream.flush();
            outputStream.close();

            File outputDirectory =
                    getContext().getExternalFilesDir(
                            Environment.DIRECTORY_MOVIES
                    );

            if (outputDirectory == null) {
                outputDirectory = getContext().getFilesDir();
            }

            if (!outputDirectory.exists()) {
                outputDirectory.mkdirs();
            }

            File outputFile = new File(
                    outputDirectory,
                    "DevilEnhancer_" +
                            System.currentTimeMillis() +
                            ".mp4"
            );

            String resolution = "3840:2160";

            if ("8K".equalsIgnoreCase(targetMode)) {
                resolution = "7680:4320";
            }

            String videoFilter =
                    "scale=" + resolution +
                    ":force_original_aspect_ratio=decrease," +
                    "pad=" + resolution +
                    ":(ow-iw)/2:(oh-ih)/2," +
                    "fps=" + targetFps;

            String command =
                    "-y " +
                    "-i " + quote(inputFile.getAbsolutePath()) + " " +
                    "-vf " + quote(videoFilter) + " " +
                    "-c:v mpeg4 " +
                    "-q:v 3 " +
                    "-c:a aac " +
                    "-b:a 192k " +
                    "-movflags +faststart " +
                    "-threads 0 " +
                    quote(outputFile.getAbsolutePath());

            FFmpegKit.executeAsync(command, session -> {

                if (ReturnCode.isSuccess(session.getReturnCode())) {

                    JSObject response = new JSObject();

                    response.put(
                            "uri",
                            outputFile.getAbsolutePath()
                    );

                    response.put(
                            "mode",
                            targetMode
                    );

                    response.put(
                            "fps",
                            targetFps
                    );

                    response.put(
                            "fileName",
                            outputFile.getName()
                    );

                    call.resolve(response);

                } else {

                    String message =
                            "FFmpeg processing failed. Code: " +
                            session.getReturnCode();

                    call.reject(message);
                }

                if (inputFile.exists()) {
                    inputFile.delete();
                }
            });

          } catch (Exception e) {

            call.reject(
                    "Enhancement error: " +
                    String.valueOf(e.getMessage())
            );
           }
          }

          private String quote(String value) {
          return "\"" +
                value.replace("\"", "\\\"") +
                "\"";
           }
          }
          JAVA

      # 8. Create MainActivity
      - name: Create MainActivity
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/devil/enhancer

          cat > android/app/src/main/java/com/devil/enhancer/MainActivity.java <<'JAVA'
          package com.devil.enhancer;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

          @Override
          public void onCreate(Bundle savedInstanceState) {
          super.onCreate(savedInstanceState);

          registerPlugin(EnhancerPlugin.class);
           }
          }
          JAVA

      # 9. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 10. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 11. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 12. Build APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew --no-daemon --refresh-dependencies assembleDebug

      # 13. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: devil-enhancer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
